<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="wash" x1="760" y1="60" x2="1120" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dcebe1" />
      <stop offset="1" stop-color="#dcebe1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rustArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c86c47" stop-opacity=".22" />
      <stop offset="1" stop-color="#c86c47" stop-opacity=".03" />
    </linearGradient>
    <linearGradient id="socGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c8278" />
      <stop offset="1" stop-color="#c86c47" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <!-- paper -->
  <rect width="1200" height="630" fill="#f5f3ed"/>

  <!-- soft wash behind instrument panel -->
  <circle cx="950" cy="240" r="220" fill="url(#wash)" filter="url(#soft)" opacity=".8"/>

  <!-- faint contours, lower-left -->
  <path d="M70 452c100-34 180 10 300-6" stroke="#8caea1" stroke-width="2" opacity=".4"/>
  <path d="M70 480c90-28 170 8 290-10" stroke="#8caea1" stroke-width="2" opacity=".3"/>

  <!-- wordmark -->
  <text x="70" y="105" fill="#123e36" font-family="DM Sans, sans-serif" font-weight="700" font-size="28" letter-spacing="8">INSPO SOFT</text>

  <!-- headline (site hero copy, Fraunces 700) -->
  <text x="70" y="205" fill="#172320" font-family="Fraunces, serif" font-weight="700" font-size="64">Engineering tools</text>
  <text x="70" y="277" fill="#172320" font-family="Fraunces, serif" font-weight="700" font-size="64">for decisions that</text>
  <text x="70" y="349" fill="#172320" font-family="Fraunces, serif" font-weight="700" font-size="64">need to hold up.</text>

  <!-- subhead -->
  <text x="70" y="420" fill="#53615c" font-family="DM Sans, sans-serif" font-weight="400" font-size="24">Energy · hydrology · water · flood engineering</text>

  <!-- instrument panel: SCENARIO / MW -->
  <rect x="740" y="80" width="390" height="320" fill="#fffefa" stroke="#c86c47" stroke-width="2.5" opacity=".9"/>
  <text x="760" y="108" fill="#a85436" font-family="JetBrains Mono, monospace" font-weight="500" font-size="12" letter-spacing="1.3">SCENARIO / MW · 24 H</text>

  <!-- legend -->
  <circle cx="1000" cy="104" r="4" fill="#c86c47"/>
  <text x="1010" y="108" fill="#53615c" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".5">MW</text>
  <circle cx="1050" cy="104" r="4" fill="#315b70"/>
  <text x="1060" y="108" fill="#53615c" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".5">PRICE</text>
  <circle cx="1102" cy="104" r="4" fill="#2c8278"/>
  <text x="1112" y="108" fill="#53615c" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".5">SOC</text>

  <!-- chart grid (MW 0-20) -->
  <g stroke="#d3d7ce" stroke-opacity=".8">
    <path d="M760 300h350M760 250h350M760 200h350M760 150h350"/>
  </g>
  <path d="M760 350h350" stroke="#123e36" stroke-opacity=".4"/>
  <g stroke="#d3d7ce" stroke-opacity=".5">
    <path d="M847.5 120v230M935 120v230M1022.5 120v230"/>
  </g>

  <!-- y axis labels -->
  <g fill="#5f6f68" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".3" text-anchor="end">
    <text x="752" y="154">20</text>
    <text x="752" y="204">15</text>
    <text x="752" y="254">10</text>
    <text x="752" y="304">5</text>
    <text x="752" y="354">0</text>
  </g>
  <!-- x axis labels -->
  <g fill="#5f6f68" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".3" text-anchor="middle">
    <text x="760" y="372">00</text>
    <text x="847.5" y="372">06</text>
    <text x="935" y="372">12</text>
    <text x="1022.5" y="372">18</text>
    <text x="1110" y="372">24 h</text>
  </g>

  <!-- SOC ribbon -->
  <g fill="#2c8278" fill-opacity=".16">
    <rect x="760" y="322" width="29.2" height="28"/>
    <rect x="789.2" y="322" width="29.1" height="28"/>
    <rect x="818.3" y="322" width="29.2" height="28"/>
    <rect x="847.5" y="318" width="29.2" height="32"/>
    <rect x="876.7" y="306" width="29.1" height="44"/>
    <rect x="905.8" y="290" width="29.2" height="60"/>
    <rect x="935" y="282" width="29.2" height="68"/>
    <rect x="964.2" y="286" width="29.1" height="64"/>
    <rect x="993.3" y="298" width="29.2" height="52"/>
    <rect x="1022.5" y="314" width="29.2" height="36"/>
    <rect x="1051.7" y="322" width="29.1" height="28"/>
    <rect x="1080.8" y="326" width="29.2" height="24"/>
  </g>
  <path d="M760 322H789.2V322H818.3V322H847.5V318H876.7V306H905.8V290H935V282H964.2V286H993.3V298H1022.5V314H1051.7V322H1080.8V326H1110" stroke="#2c8278" stroke-width="1.5"/>

  <!-- price line -->
  <path d="M760 308 C 775 314 780 321 789.2 318.5 C 800 315 810 330 818.3 329 C 828 328 838 325 847.5 323.75 C 860 322 866 300 876.7 287 C 888 272 898 215 905.8 203 C 914 189 926 130 935 119 C 944 130 954 165 964.2 161 C 976 156 984 190 993.3 213.5 C 1004 238 1012 195 1022.5 182 C 1032 170 1042 152 1051.7 140 C 1062 158 1070 190 1080.8 203 C 1090 215 1100 260 1110 276.5" stroke="#315b70" stroke-width="2" stroke-opacity=".75" stroke-linecap="round"/>

  <!-- dispatch area + line -->
  <path d="M760 350 C 770 350 780 348 789.2 346 C 800 342 810 335 818.3 328 C 830 316 838 300 847.5 292 C 860 278 868 262 876.7 256 C 886 250 896 228 905.8 224 C 916 218 926 208 935 202 C 944 196 954 190 964.2 188 C 974 185 984 172 993.3 166 C 1004 175 1012 188 1022.5 191 C 1034 205 1042 224 1051.7 238 C 1062 256 1072 280 1080.8 294 C 1090 312 1100 335 1110 342 L 1110 350 L 760 350 Z" fill="url(#rustArea)"/>
  <path d="M760 350 C 770 350 780 348 789.2 346 C 800 342 810 335 818.3 328 C 830 316 838 300 847.5 292 C 860 278 868 262 876.7 256 C 886 250 896 228 905.8 224 C 916 218 926 208 935 202 C 944 196 954 190 964.2 188 C 974 185 984 172 993.3 166 C 1004 175 1012 188 1022.5 191 C 1034 205 1042 224 1051.7 238 C 1062 256 1072 280 1080.8 294 C 1090 312 1100 335 1110 342" stroke="#c86c47" stroke-width="3.5" stroke-linecap="round"/>

  <!-- peak callout -->
  <circle cx="993.3" cy="166" r="4.5" fill="#a85436"/>
  <circle cx="993.3" cy="166" r="8" stroke="#a85436" stroke-opacity=".3"/>
  <path d="M1000 162 L 1080 142" stroke="#a85436" stroke-opacity=".55" stroke-dasharray="4 4"/>
  <text x="1110" y="140" fill="#a85436" font-family="JetBrains Mono, monospace" font-weight="500" font-size="11" letter-spacing=".5" text-anchor="end">PEAK 18.4 MW</text>

  <!-- storage node -->
  <rect x="740" y="416" width="390" height="72" rx="8" fill="#fffefa" stroke="#123e36" stroke-width="2"/>
  <text x="760" y="442" fill="#123e36" font-family="JetBrains Mono, monospace" font-weight="500" font-size="12" letter-spacing="1.2">STORAGE / REVIEW</text>
  <rect x="760" y="452" width="150" height="16" rx="3" fill="#e9e7df" stroke="#123e36" stroke-opacity=".35"/>
  <rect x="790" y="452" width="105" height="16" rx="3" fill="url(#socGrad)"/>
  <text x="760" y="482" fill="#315b70" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".5">SOC 20–90 %</text>
  <text x="924" y="482" fill="#315b70" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".5">η 92 %</text>
  <circle cx="1052" cy="462" r="4" fill="#2c8278"/>
  <text x="1062" y="466" fill="#2c8278" font-family="JetBrains Mono, monospace" font-weight="500" font-size="10" letter-spacing=".5">REVIEW READY</text>

  <!-- figure caption + scale note -->
  <text x="740" y="516" fill="#315b70" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".6">FIG. 01 — SYNTHETIC DISPATCH SCENARIO · MODELLED</text>
  <text x="1130" y="516" fill="#5f6f68" font-family="JetBrains Mono, monospace" font-weight="400" font-size="10" letter-spacing=".6" text-anchor="end">SCALE / SYNTHETIC</text>

  <!-- data to decision spine -->
  <path d="M70 556h1060" stroke="#123e36" opacity=".25" stroke-width="2"/>
  <path d="M130 552v8M400 552v8M670 552v8M940 552v8" stroke="#123e36" opacity=".25"/>
  <circle cx="130" cy="556" r="4" fill="#c86c47"/>
  <circle cx="400" cy="556" r="4" fill="#2c8278"/>
  <circle cx="670" cy="556" r="4" fill="#315b70"/>
  <circle cx="940" cy="556" r="4" fill="#123e36"/>
  <g fill="#123e36" font-family="JetBrains Mono, monospace" font-weight="400" font-size="12" letter-spacing="1.2" text-anchor="middle">
    <text x="130" y="573">DATA</text>
    <text x="400" y="573">METHOD</text>
    <text x="670" y="573">REVIEW</text>
    <text x="940" y="573">DECISION</text>
  </g>

  <!-- colophon -->
  <text x="70" y="612" fill="#5f6f68" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13" letter-spacing="3">INSPO / 001 · INSPOSOFT.COM</text>
</svg>
